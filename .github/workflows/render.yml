name: Blender cloud film
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render mode
        type: choice
        options: [lookdev, stills, full, patch]
        default: lookdev
        required: true
      frames:
        description: Comma separated frames or ranges like 302-392 (stills, patch)
        type: string
        default: '1,240,480,720,960,1200'
      base_run:
        description: Run whose frames the patch replaces (patch only)
        type: string
        default: ''
      chunks:
        description: Full render chunks (1 to 100)
        type: number
        default: 20
        required: true
permissions:
  contents: read
  actions: read
env:
  BLENDER_VERSION: 4.2.0
  BLENDER_ARCHIVE: blender-4.2.0-linux-x64.tar.xz
  ASSET_DIR: ${{ github.workspace }}/build/assets
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and plan chunks
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python - <<'PY'
          import json, os
          count = int(os.environ['CHUNKS'])
          if not 1 <= count <= 100:
              raise SystemExit('[build] chunks must be between 1 and 100')
          if os.environ['MODE'] not in ('lookdev', 'stills', 'full', 'patch'):
              raise SystemExit('[build] invalid mode')
          matrix = {'chunk': list(range(count if os.environ['MODE'] in ('full', 'patch') else 1))}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(matrix), file=output)
          PY
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: .cache/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}
      - name: Install pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/blender
          cd .cache/blender
          curl --fail --location --retry 3 -O "https://download.blender.org/release/Blender4.2/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 -o checksums.txt "https://download.blender.org/release/Blender4.2/blender-$BLENDER_VERSION.sha256"
          grep " $BLENDER_ARCHIVE$" checksums.txt | sha256sum --check --strict
          tar -xf "$BLENDER_ARCHIVE" --strip-components=1
          rm "$BLENDER_ARCHIVE"
      - uses: actions/cache@v4
        with:
          path: build/assets
          key: assets-blender-${{ env.BLENDER_VERSION }}-${{ hashFiles('blender/assets.json', 'blender/assets.py') }}
      - name: Download assets and build scene
        env:
          MODE: ${{ inputs.mode }}
        run: |
          .cache/blender/blender --version
          .cache/blender/blender -b --factory-startup --python-exit-code 1 -P blender/build.py -- --mode "${MODE/patch/full}" --prepare-assets --out build/lesmis.blend || { cat /tmp/blender.crash.txt 2>/dev/null | head -60; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: scene
          path: |
            build/lesmis.blend
            build/assets
          if-no-files-found: error
          retention-days: 7
  render:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/blender
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: scene
          path: build
      - name: Render chunk
        env:
          MODE: ${{ inputs.mode }}
          FRAMES: ${{ inputs.frames }}
          CHUNK: ${{ matrix.chunk }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          .cache/blender/blender -b build/lesmis.blend --python-exit-code 1 -P blender/render.py -- --mode "$MODE" --frames "$FRAMES" --chunk "$CHUNK" --chunks "$CHUNKS" --out build/frames
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mode == 'patch' && 'patch' || 'frames' }}-${{ matrix.chunk }}
          path: build/frames/*.png
          if-no-files-found: error
          retention-days: 7
  assemble:
    if: inputs.mode == 'full' || inputs.mode == 'patch'
    needs: render
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'full'
        with:
          pattern: frames-*
          merge-multiple: true
          path: build/frames
      # Patch: wait for the base run, take all its frames, then overwrite the re-rendered ones.
      - name: Wait for the base run
        if: inputs.mode == 'patch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
        run: |
          test -n "$BASE_RUN" || { echo '[assemble] patch mode needs base_run' >&2; exit 1; }
          until [ "$(gh run view "$BASE_RUN" -R "$GITHUB_REPOSITORY" --json status --jq .status)" = completed ]; do sleep 60; done
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'patch'
        with:
          pattern: frames-*
          merge-multiple: true
          path: build/frames
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'patch'
        with:
          pattern: patch-*
          merge-multiple: true
          path: build/patch
      - name: Overlay patched frames
        if: inputs.mode == 'patch'
        run: |
          echo "[assemble] patching $(ls build/patch/*.png | wc -l) frames over $(ls build/frames/*.png | wc -l)"
          cp -f build/patch/*.png build/frames/
      - uses: actions/download-artifact@v4
        with:
          name: scene
          path: build
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Assemble film
        run: bash post/assemble.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lesmis-film
          path: build/lesmis.mp4
          if-no-files-found: error
          retention-days: 14
