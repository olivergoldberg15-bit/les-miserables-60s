<!doctype html>
<html><head><meta charset="utf-8"><title>lookdev</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Coordinator review harness: one kit builder on its own.
// ?kit=town&fn=makeTownDusk&p=0.5&t=1&cam=x,y,z&tgt=x,y,z&fov=40&opts={"moonlit":true}
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const v3 = (s) => s && new THREE.Vector3(...s.split(",").map(Number));
const mod = await import(`../js/kit/${q.get("kit")}.js`);
let out = await mod[q.get("fn")](JSON.parse(q.get("opts") || "{}"));
if (q.get("maker")) {
  // figure kit: ?kit=figure&fn=loadFigures&maker=makeValjean&pose=walk&phase=0.3&rim=1
  const fig = out[q.get("maker")]();
  fig.pose(q.get("pose") || "stand", Number(q.get("phase") ?? 0));
  const g = new THREE.Group(); g.add(fig.group);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0x5a5249, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; g.add(floor);
  const key = new THREE.DirectionalLight(q.get("rim") ? 0xffb36b : 0xffffff, q.get("rim") ? 6 : 2.2);
  key.position.set(q.get("rim") ? -1 : 2, 3, q.get("rim") ? -4 : 3); key.castShadow = true; g.add(key);
  g.add(new THREE.HemisphereLight(0x8090b0, 0x302820, q.get("rim") ? 0.15 : 0.6));
  out = { group: g, look: { bg: q.get("rim") ? 0x1a1e28 : 0x3a3f48 } };
}
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
r.setSize(1280, 720, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.add(out.group);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
const L = out.look || {};
scene.background = new THREE.Color(L.bg ?? 0x202430);
if (L.fog) scene.fog = new THREE.FogExp2(L.fog.color ?? L.bg, L.fog.density ?? 0.01);
r.toneMappingExposure = L.exposure ?? 1;
const p = Number(q.get("p") ?? 0.5), t = Number(q.get("t") ?? 1);
if (out.update) out.update(t, p);
const box = new THREE.Box3().setFromObject(out.group), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(Number(q.get("fov") ?? 40), 16 / 9, 0.01, 2000);
const R = Math.max(s.x, s.y, s.z);
cam.position.copy(v3(q.get("cam")) || c.clone().add(new THREE.Vector3(0.75 * R, 0.45 * R, 1.1 * R)));
cam.lookAt(v3(q.get("tgt")) || c);
r.render(scene, cam);
document.title = "ready " + [s.x, s.y, s.z].map((x) => x.toFixed(2)).join("x");
</script></body></html>
